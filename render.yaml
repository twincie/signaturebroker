services:
  - type: web
    name: signaturebroker
    env: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_USERNAME
        value: insurance
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: QUOTE_EMAIL_FROM
        sync: false
      - key: QUOTE_EMAIL_TO
        sync: false
      - key: QUOTE_PROVIDER_URL
        sync: false
      - key: QUOTE_PROVIDER_API_KEY
        sync: false
